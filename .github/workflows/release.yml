name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source android/version.properties
          expected="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          }

      - name: Restore Android signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret" >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/transit-krama-upload.jks"
          test -s "$RUNNER_TEMP/transit-krama-upload.jks"

      - name: Run Android unit tests and build release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Run Android unit tests and build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/transit-krama-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name Android release APK
        shell: bash
        run: |
          source android/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          apk_dir="android/app/build/outputs/apk/release"
          if [ -f "$apk_dir/app-release.apk" ]; then
            source_apk="$apk_dir/app-release.apk"
          else
            source_apk="$apk_dir/app-release-unsigned.apk"
          fi
          mv "$source_apk" "$apk_dir/transit-krama-${version}-release.apk"

      - name: Verify signed APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source android/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            "android/app/build/outputs/apk/release/transit-krama-${version}-release.apk"

      - name: Remove Android signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/transit-krama-upload.jks"

      - name: Package web app
        shell: bash
        run: |
          source android/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          zip -r "transit-krama-webapp-${version}.zip" webapp

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: transit-krama-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/transit-krama-*-release.apk
            transit-krama-webapp-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/transit-krama-*-release.apk
            transit-krama-webapp-*.zip
